name: Update Profile Views Badge

on:
  schedule:
    # Hourly at minute 17 (UTC)
    - cron: "17 * * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/profile-views.yml"
      - "scripts/update_profile_views.py"
      - "tests/test_profile_views.py"
  workflow_dispatch:

concurrency:
  group: profile-card-updates
  cancel-in-progress: false

jobs:
  update-profile-views:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Test profile views updater
        run: python3 -m unittest discover -s tests -p 'test_profile_views.py'

      - name: Refresh profile views badge
        run: python3 scripts/update_profile_views.py

      - name: Commit updated profile views badge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/profile-views.svg

          if git diff --cached --quiet; then
            echo "Profile views badge is already up to date."
            exit 0
          fi

          git commit -m "chore: update profile views badge"
          git pull --rebase
          git push
