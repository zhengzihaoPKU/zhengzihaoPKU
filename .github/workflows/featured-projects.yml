name: Update Featured Project Cards

on:
  schedule:
    # 00:25 UTC every day
    - cron: "25 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-card-updates
  cancel-in-progress: false

jobs:
  update-project-cards:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate Robonix card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=syswonder&repo=robonix&show_owner=true&hide_border=true&bg_color=0D1117&title_color=22D3EE&icon_color=A78BFA&text_color=C9D1D9&border_radius=12
          path: profile/projects/robonix.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate KERV card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=zhengzihaoPKU&repo=KERV&hide_border=true&bg_color=0D1117&title_color=22D3EE&icon_color=A78BFA&text_color=C9D1D9&border_radius=12
          path: profile/projects/kerv.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate RoboECC card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=zhengzihaoPKU&repo=RoboECC&hide_border=true&bg_color=0D1117&title_color=22D3EE&icon_color=A78BFA&text_color=C9D1D9&border_radius=12
          path: profile/projects/roboecc.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Edge MoE card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=zhengzihaoPKU&repo=A-Pilot-Quant-Deployment-for-Edge-MoEs&hide_border=true&bg_color=0D1117&title_color=22D3EE&icon_color=A78BFA&text_color=C9D1D9&border_radius=12
          path: profile/projects/edge-moe.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated project cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/projects/*.svg

          if git diff --cached --quiet; then
            echo "Project cards are already up to date."
            exit 0
          fi

          git commit -m "chore: update featured project cards"
          git pull --rebase
          git push
