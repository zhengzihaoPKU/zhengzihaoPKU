name: Generate Contribution Snake

on:
  schedule:
    # Every 5 minutes (UTC)
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8C0000&color_dots=#F2EEEE,#F2D6D6,#D99A9A,#B54A4A,#8C0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F2B8B8&color_dots=#161B22,#4A1A1A,#7A2929,#B54A4A,#E6A0A0

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
